name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "chore/**", "feat/**", "feature/**", "fix/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://nokAY:ci-password@localhost:5432/nokay_ci?schema=public
      AUTH_SECRET: ci-only-secret-with-more-than-thirty-two-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
